name: build

# dist/ is what uBlock Origin fetches over a raw URL, so a stale copy there
# ships stale code to everyone. This rebuilds from src/ and fails if the result
# differs from what was committed.

on:
  pull_request:
  push:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'tools/**'
      - 'test/**'
      - 'dist/**'
      - 'filters/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/build.yml'
      # The build reads these: it refuses to run if an install URL in one
      # names a version other than package.json's. A change here can fail the
      # build, so it has to be able to run the build.
      - 'README.md'
      - 'AGENTS.md'
      - 'CLAUDE.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Builds, then runs the suite against the built files.
      - run: npm test
      - name: dist matches src
        run: |
          if ! git diff --exit-code --stat -- dist; then
            echo "::error::committed output is stale - run 'npm test' and commit the result"
            exit 1
          fi
      # Seconds, and it catches the one thing a shorter mutation run cannot:
      # a mutation whose anchor no longer matches has stopped testing
      # anything, which is what a rename in the code it watches does to it.
      - name: mutation anchors still match
        run: npm run anchors
      # Every test here is meant to fail against broken code. This proves it,
      # by breaking the code on purpose - see tools/mutate.mjs.
      - run: npm run mutate
      # The build already checks that a pinned install URL names the version
      # being built. This checks the other half: that the version exists as a
      # tag, so the URL actually resolves. v1.1.2 and v1.1.4 were pinned in the
      # README and never tagged, and uBO skips a URL that 404s without a word,
      # so the resource was simply absent. Asked of the API rather than the raw
      # host, which caches a 404 for minutes after the tag lands.
      - name: pinned install URLs resolve
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -u
          fail=0
          for u in $(grep -ohE 'gtm-rr/v[0-9]+\.[0-9]+\.[0-9]+/dist/[A-Za-z0-9_.-]+' \
              README.md AGENTS.md CLAUDE.md | sort -u); do
            ref=${u#gtm-rr/}; ref=${ref%%/*}
            path=dist/${u##*/}
            for attempt in 1 2 3 4 5 6; do
              if gh api "repos/${{ github.repository }}/contents/$path?ref=$ref" \
                  --jq .sha >/dev/null 2>&1; then
                echo "ok   $ref $path"
                break
              fi
              if [ "$attempt" = 6 ]; then
                echo "::error::$path does not exist at $ref - the docs tell"\
                  "people to install a version that was never tagged, and uBO"\
                  "skips a URL that 404s in silence"
                fail=1
                break
              fi
              sleep 20
            done
          done
          exit $fail
